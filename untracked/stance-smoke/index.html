<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>AfConductGauge stance smoke</title>
<style>
  body { background: #0b0f14; color: #cbd5e1; font: 12px ui-monospace, Menlo, monospace; margin: 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .cap { color: #94a3b8; max-width: 200px; text-align: center; }
  canvas { background: #10161d; border-radius: 12px; }
</style>
<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>
<script type="importmap">
{ "imports": { "react": "./react-shim.js", "react/jsx-runtime": "./jsx-runtime-shim.js" } }
</script>
</head>
<body>
<h3>AfConductGauge v2 — THE STANCE (real dist)</h3>
<pre id="err" style="color:#e05555"></pre>
<div class="row" id="root"></div>
<script>
window.addEventListener("error", (e) => {
  document.getElementById("err").textContent += (e.message || String(e.error)) + "\n" + (e.filename||"") + ":" + (e.lineno||"") + "\n";
});
window.addEventListener("unhandledrejection", (e) => {
  document.getElementById("err").textContent += "PROMISE: " + String(e.reason && e.reason.stack || e.reason) + "\n";
});
</script>
<script type="module">
import { AfConductGauge } from "./kit/af_conduct_gauge.js";
const R = window.React;
const cases = [
  { name: "busy verified turn", props: {
      facts: { think_ms: 9200, tokens_out: 640, tool_rounds: 4, memories_recalled: 8, memories_formed: 2 },
      tools: [
        { name: "read_file", ok: true }, { name: "search_memory", ok: true },
        { name: "write_file", ok: false }, { name: "write_file", ok: true },
        { name: "check_theme", ok: true }, { name: "list_dir", ok: true },
      ],
      baseline: { think_ms: 4000, tokens_out: 350, tool_rounds: 2, memories_recalled: 6 },
    } },
  { name: "quiet idle turn (small breath must live)", props: {
      facts: { think_ms: 900, tokens_out: 60, tool_rounds: 0, memories_recalled: 2 },
      tools: [],
      baseline: { think_ms: 4000, tokens_out: 350, tool_rounds: 2, memories_recalled: 6 },
    } },
  { name: "low rigor flurry (askew)", props: {
      facts: { think_ms: 5200, tokens_out: 420, tool_rounds: 6, memories_recalled: 4 },
      tools: [
        { name: "execute_command", ok: true }, { name: "execute_command", ok: true },
        { name: "write_file", ok: true }, { name: "execute_command", ok: false },
        { name: "write_file", ok: true }, { name: "send_message", ok: true },
      ],
      baseline: { think_ms: 4000, tokens_out: 350, tool_rounds: 2, memories_recalled: 6 },
    } },
  { name: "rejoined transcript (all absent)", props: { facts: null, tools: [], baseline: null, note: "gauges fill with the next reply" } },
  { name: "first turns (no baseline)", props: {
      facts: { think_ms: 3000, tokens_out: 200, tool_rounds: 1, memories_recalled: 5, memories_formed: 1 },
      tools: [{ name: "diary_list", ok: true }],
      baseline: null,
    } },
  { name: "labels off (entity DOM row)", props: {
      facts: { think_ms: 5000, tokens_out: 300, tool_rounds: 2, memories_recalled: 6 },
      tools: [{ name: "read_file", ok: true }, { name: "fetch_url", ok: true }],
      baseline: { think_ms: 4000, tokens_out: 350, tool_rounds: 2, memories_recalled: 6 },
      labels: false,
    } },
];
const root = window.ReactDOM.createRoot(document.getElementById("root"));
root.render(R.createElement(R.Fragment, null, cases.map((c, i) =>
  R.createElement("div", { className: "cell", key: i },
    R.createElement(AfConductGauge, { size: 190, ...c.props }),
    R.createElement("div", { className: "cap" }, c.name))
)));
window.__smokeReady = true;
</script>
</body>
</html>
