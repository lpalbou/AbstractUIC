<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared avatar gallery</title><link rel="stylesheet" href="../src/theme.css"><style>
body{margin:0;background:var(--bg-primary);color:var(--text-primary);font:15px system-ui}main{max-width:1060px;margin:36px auto;padding:0 24px}h1{font-size:28px}p,small{color:var(--text-secondary)}.controls{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:24px 0}button,select{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--ui-border-2);border-radius:8px;padding:8px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}article{text-align:center;padding:16px;border:1px solid var(--ui-border-2);border-radius:18px;background:var(--bg-secondary)}article h2{margin:4px}article p{min-height:36px;font-size:13px}:root.light{--bg-primary:#f4f5f7;--bg-secondary:#fff;--text-primary:#272b36;--text-secondary:#586174;--warning:#a87719;--error:#c33c4b;--ui-border-2:rgba(15,30,50,.2)}
</style><div id="app"></div><script type="module" src="./build/avatar_gallery.js"></script></html>
