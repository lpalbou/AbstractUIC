<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entity card</title><link rel="stylesheet" href="../src/theme.css"><style>
body{margin:0;background:var(--bg-primary);color:var(--text-primary);font:14px system-ui}main{max-width:1360px;margin:24px auto;padding:0 16px}h1{font-size:24px}h2{font-size:15px;color:var(--text-secondary);margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:stretch}.pair{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,360px));gap:14px;align-items:start}.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-items:start}
</style><div id="app"></div><script type="module" src="./build/entity_cards.js"></script></html>
