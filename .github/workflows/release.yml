name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Test packages
        run: npm test

      - name: Validate package tarballs
        run: npm run pack:dry

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match root package.json version ($ROOT_VERSION)." >&2
            exit 1
          fi
          # Package versions are independent (a package is only bumped when it
          # changes); the tag names the monorepo release, i.e. the root version.

      - name: Publish @abstractframework/ui-kit
        working-directory: ui-kit
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @abstractframework/monitor-active-memory
        working-directory: monitor-active-memory
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @abstractframework/monitor-flow
        working-directory: monitor-flow
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @abstractframework/monitor-gpu
        working-directory: monitor-gpu
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @abstractframework/panel-chat
        working-directory: panel-chat
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

      # Published last: these packages have no dependents inside this repo, so
      # they cannot hold back the packages above. npm trusted publishing cannot
      # create a package name (npm/cli#8544): a package that does not exist on
      # the registry yet must be published once with an access token, after
      # which its trusted publisher is configured and this step takes over.
      # The publish is still attempted so the registry's exact answer is in
      # the log; a refusal of a first-time publish is a warning, not a failure.
      - name: Publish @abstractframework/app-server and monitor-memory
        run: |
          for dir in app-server monitor-memory; do
            PKG_NAME="$(node -p "require('./${dir}/package.json').name")"
            PKG_VERSION="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
            elif npm view "${PKG_NAME}" version >/dev/null 2>&1; then
              (cd "${dir}" && npm publish --access public --provenance)
            elif ! OUT="$(cd "${dir}" && npm publish --access public --provenance 2>&1)"; then
              echo "$OUT"
              ERR="$(printf '%s\n' "$OUT" | grep -E 'npm (error|ERR)' | head -3 | tr '\n' ' ')"
              echo "::warning::${PKG_NAME}@${PKG_VERSION} first-time publish refused by the registry: ${ERR}"
            else
              echo "$OUT"
            fi
          done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          awk -v heading="## ${VERSION}" '
            index($0, heading) == 1 &&
              (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") {
              capture = 1
              next
            }
            capture && index($0, "## ") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md section found for ${VERSION}." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
